<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0c" />
    <title>Daksh Jawla — Computer Science</title>
    <meta
      name="description"
      content="Daksh Jawla — computer science student building systems, networks and interfaces. Selected work, experience and contact."
    />
    <meta property="og:title" content="Daksh Jawla — Computer Science" />
    <meta property="og:description" content="Systems, networks and interfaces. Selected work." />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0c0c'/%3E%3Ctext x='16' y='24' font-family='monospace' font-size='20' font-weight='700' fill='%23fa4e3e' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E"
    />
  </head>

  <body>
    <div class="grain" aria-hidden="true"></div>

    <div class="cursor" aria-hidden="true">
      <div class="cursor__ring"></div>
      <div class="cursor__dot"></div>
    </div>

    <!-- ── Preloader ───────────────────────────────────────────────────── -->
    <div class="loader" id="loader">
      <div class="loader__row">
        <span class="mono" data-loader-name></span>
        <span class="mono" id="loaderNum">000</span>
      </div>
      <div class="loader__bar"><i id="loaderBar"></i></div>
    </div>

    <!-- ── Nav ─────────────────────────────────────────────────────────── -->
    <header class="nav" id="nav">
      <a class="nav__mark" href="#top" data-cursor="link">
        <span class="mono" data-nav-mark></span>
      </a>

      <nav class="nav__mid" aria-label="Primary">
        <a href="#work" data-nav-link>Work</a>
        <a href="#about" data-nav-link>About</a>
        <a href="#contact" data-nav-link>Contact</a>
      </nav>

      <div class="nav__end">
        <span class="mono nav__clock" data-clock></span>
        <button class="menuBtn" id="menuBtn" aria-expanded="false" aria-controls="menu">
          <span class="mono">Menu</span>
          <i></i><i></i>
        </button>
      </div>
    </header>

    <!-- ── Fullscreen menu ─────────────────────────────────────────────── -->
    <div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Menu" hidden>
      <ul class="menu__list" data-menu-list></ul>
      <div class="menu__foot">
        <ul class="menu__socials" data-menu-socials></ul>
        <span class="mono" data-menu-mail></span>
      </div>
    </div>

    <main id="top">
      <!-- ── HERO ──────────────────────────────────────────────────────── -->
      <section class="hero">
        <h1 class="hero__display display" data-hero-display></h1>

        <div class="hero__rule" aria-hidden="true">
          <span class="mono">º</span><i></i><span class="mono">∞</span><i></i><span class="mono">º</span>
        </div>

        <div class="hero__meta">
          <span class="mono" data-hero-location></span>
          <span class="mono" data-hero-role></span>
        </div>

        <div class="hero__stack" data-hero-stack></div>

        <a class="hero__cue mono" href="#about" data-cursor="link">
          <span>Scroll</span><i></i>
        </a>
      </section>

      <!-- Full-bleed band, where the reference puts its hero photograph -->
      <figure class="band" data-media="hero"></figure>

      <!-- Sections are generated from content.js, in its order -->
      <div id="sections"></div>

      <!-- ── CTA ───────────────────────────────────────────────────────── -->
      <section class="cta" id="contact">
        <figure class="cta__bg" data-media="cta" aria-hidden="true"></figure>
        <p class="mono cta__eyebrow">Open to internships &amp; collaborators</p>
        <h2 class="cta__title display">Let's build<br />something</h2>
        <a class="btn" data-contact-mail href="#" data-cursor="link" data-magnetic>
          <span>Get in touch</span>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 12L12 4M12 4H5.5M12 4v6.5" /></svg>
        </a>
      </section>

      <!-- ── Footer ────────────────────────────────────────────────────── -->
      <footer class="foot">
        <span class="mono" data-foot-left></span>
        <ul class="foot__socials" data-foot-socials></ul>
        <a class="mono foot__top" href="#top" data-cursor="link">Back to top ↑</a>
      </footer>
    </main>

    <noscript>
      <div class="noscript">
        This site uses JavaScript for its layout and motion. Reach me directly at
        <a href="mailto:dakshjawla326@gmail.com">dakshjawla326@gmail.com</a>.
      </div>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
